# Postgres only. Run Django on the host (python manage.py ...), not in Docker.
services:
  db:
    image: postgres:latest
    container_name: django-tasks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: django_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d django_tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
